<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hooni Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 font-sans p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm">
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <span class="bg-gray-800 text-white p-1 rounded text-sm">Admin</span> 대시보드
            </h1>
            <a href="/"
                class="flex items-center gap-2 text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg transition-colors font-medium text-sm">
                <i data-lucide="external-link" class="w-4 h-4"></i> 내 사이트 보기
            </a>
        </div>

        <!-- Product Table -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th
                                class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                상품 정보</th>
                            <th
                                class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                성과 (클릭)</th>
                            <th
                                class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                제휴 링크 관리</th>
                            <th
                                class="px-6 py-4 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                관리</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        {% for product in products %}
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="flex items-center">
                                    <div
                                        class="flex-shrink-0 h-12 w-12 rounded-lg overflow-hidden border border-gray-200">
                                        <img class="h-full w-full object-cover" src="{{ product.image_url }}" alt="">
                                    </div>
                                    <div class="ml-4">
                                        <div class="text-sm font-bold text-gray-900 truncate w-48">{{ product.title }}
                                        </div>
                                        <div
                                            class="text-xs text-gray-500 font-mono bg-gray-100 inline-block px-1 rounded mt-1">
                                            {{ product.item_id }}</div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="flex items-center gap-2">
                                    <span
                                        class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800 border border-green-200">
                                        {{ product.clicks }} Click
                                    </span>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <form action="/admin" method="POST"
                                    class="flex items-center gap-2 bg-gray-50 p-1 rounded-lg border border-gray-200 w-fit">
                                    <input type="hidden" name="action" value="update_link">
                                    <input type="hidden" name="id" value="{{ product.id }}">
                                    <input type="text" name="link" value="{{ product.link }}"
                                        class="text-xs bg-transparent border-none focus:ring-0 text-gray-600 w-40 truncate px-2 outline-none"
                                        placeholder="https://...">
                                    <button type="submit"
                                        class="bg-white hover:bg-blue-50 text-blue-600 p-1.5 rounded-md border border-gray-200 transition-colors"
                                        title="저장">
                                        <i data-lucide="edit-2" class="w-3 h-3"></i>
                                    </button>
                                </form>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <form action="/admin" method="POST" onsubmit="return confirm('정말 삭제하시겠습니까?');"
                                    class="inline">
                                    <input type="hidden" name="action" value="delete">
                                    <input type="hidden" name="id" value="{{ product.id }}">
                                    <button type="submit"
                                        class="text-gray-400 hover:text-red-600 transition-colors p-2 hover:bg-red-50 rounded-full"
                                        title="삭제">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
