<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ '포스트 수정' if post else '새 포스트' }} - Naver Poster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="flex min-h-screen">
        <!-- 사이드바 -->
        <aside class="w-56 bg-gray-900 text-white flex-shrink-0 flex flex-col">
            <div class="p-5 border-b border-gray-700">
                <h1 class="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="send" class="w-5 h-5 text-green-400"></i>
                    Naver Poster
                </h1>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <a href="/dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-800 text-gray-300 text-sm transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 대시보드
                </a>
                <a href="/dashboard/post/new" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-gray-800 text-white text-sm font-medium">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> 새 포스트
                </a>
                <a href="/admin" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-800 text-gray-300 text-sm transition">
                    <i data-lucide="package" class="w-4 h-4"></i> 상품 관리
                </a>
            </nav>
        </aside>

        <!-- 메인 -->
        <main class="flex-1 p-6 overflow-auto">

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-4">
                {% for cat, msg in messages %}
                <div class="px-4 py-3 rounded-lg text-sm font-medium
                    {% if cat == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                    {{ msg }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <div class="flex items-center gap-3 mb-6">
                <a href="/dashboard" class="text-gray-400 hover:text-gray-600 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <h2 class="text-2xl font-bold text-gray-800">{{ '포스트 수정' if post else '새 포스트 작성' }}</h2>
            </div>

            <form method="POST" class="max-w-3xl space-y-5">

                <!-- 제목 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">제목 *</label>
                    <input type="text" name="title" value="{{ post.title if post else '' }}" required
                           placeholder="매력적인 포스트 제목을 입력하세요"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- 키워드 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">키워드</label>
                        <input type="text" name="keyword" value="{{ post.keyword if post else '' }}"
                               placeholder="예: 가성비맛집"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none text-sm">
                    </div>
                    <!-- 카테고리 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">카테고리</label>
                        <select name="category"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none text-sm bg-white">
                            {% for cat in ['일반', '리뷰', '맛집', '뷰티', '육아', 'IT/테크', '여행', '건강'] %}
                            <option value="{{ cat }}" {% if post and post.category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <!-- 연결 상품 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">연결 상품</label>
                        <select name="product_id"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none text-sm bg-white">
                            <option value="">없음</option>
                            {% for p in products %}
                            <option value="{{ p.id }}" {% if post and post.product_id == p.id %}selected{% endif %}>
                                {{ p.title[:30] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- 본문 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">본문 내용</label>
                    <textarea name="content" rows="12"
                              placeholder="포스트 내용을 작성하세요. HTML 태그도 사용 가능합니다."
                              class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none text-sm resize-y">{{ post.content if post else '' }}</textarea>
                </div>

                <!-- 예약 발행 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">예약 발행 시간 (선택)</label>
                    <input type="datetime-local" name="scheduled_at"
                           value="{{ post.scheduled_at.strftime('%Y-%m-%dT%H:%M') if post and post.scheduled_at else '' }}"
                           class="w-full md:w-auto px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none text-sm">
                </div>

                <!-- 버튼 -->
                <div class="flex items-center gap-3 pt-4 border-t border-gray-200">
                    <button type="submit" name="action" value="draft"
                            class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> 임시저장
                    </button>
                    <button type="submit" name="action" value="schedule"
                            class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
                        <i data-lucide="clock" class="w-4 h-4"></i> 예약 발행
                    </button>
                    <a href="/dashboard" class="text-sm text-gray-500 hover:text-gray-700 ml-2">취소</a>
                </div>

            </form>
        </main>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
