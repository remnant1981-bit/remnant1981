<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} - Best Offer</title>
    <!-- Google Fonts for premium feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* Changed from center to accommodate scrolling on small screens */
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            /* Mobile-first optimization */
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .image-container {
            width: 100%;
            height: 300px;
            /* Fixed height for consistency */
            overflow: hidden;
            background-color: #eee;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            padding: 24px;
        }

        .badge {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-main);
            line-height: 1.2;
        }

        .description {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 24px;
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .cta-button {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.125rem;
            padding: 16px;
            border-radius: 12px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .cta-button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .cta-button:active {
            transform: translateY(1px);
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .footer a {
            color: #94a3b8;
            text-decoration: underline;
        }

        /* Loading/Skeleton Animation (Optional Polish) */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="image-container">
                {% if product.image_url %}
                <img src="{{ product.image_url }}" alt="{{ product.title }}">
                {% else %}
                <div
                    style="width:100%; height:100%; background:#ddd; display:flex; align-items:center; justify-content:center; color:#888;">
                    No Image Available
                </div>
                {% endif %}
            </div>

            <div class="content">
                <span class="badge">Recommended</span>
                <h1>{{ product.title }}</h1>

                {% if product.price_text %}
                <div class="price-tag">{{ product.price_text }}</div>
                {% endif %}

                <p class="description">
                    {{ product.desc }}
                </p>

                <a href="{{ product.link }}" class="cta-button" target="_blank" rel="noopener noreferrer">
                    최저가 확인하기
                </a>
            </div>
        </div>

        <div class="footer">
            <p>Transparency: This page may contain affiliate links.</p>
            <p>&copy; 2025 Best Choice. All rights reserved.</p>
        </div>
    </div>

</body>

</html>
