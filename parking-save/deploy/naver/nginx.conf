# 파킹세이브 리버스 프록시 (setup.sh가 __DOMAIN__ 치환, certbot이 443 설정을 추가)
# 접속 로그에 쿼리 문자열(검색 좌표·시간)을 남기지 않음 — $uri만 기록(개인정보·위치정보 처리방침과 일치)
log_format parkingsave_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 64k;
    access_log /var/log/nginx/parking-save.access.log parkingsave_noquery;

    # 관리자 API는 외부에 열지 않음(정기 수집은 서버 안 cron이 127.0.0.1로 호출)
    location /api/admin/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 덧붙이기(기본값): 앱은 끝에서 TRUSTED_PROXY_COUNT(=1)번째 값을 실제 클라이언트로 사용
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
