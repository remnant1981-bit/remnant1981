<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파킹세이브 관리자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 한 열 모바일 앱(최대 720px). 위 검색 패널 → 요약 → 결과 카드. 주차 표지판의 파랑을 강조색으로, 아스팔트 회색 중립색 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #18202c;
  --muted: #586273;
  --line: #d8dde6;
  --accent: #1d4ed8;
  --accent-ink: #ffffff;
  --accent-soft: #e6edfc;
  --free: #11724b;
  --free-soft: #e3f4ec;
  --warn: #8a5300;
  --warn-soft: #fdf2df;
  --bad: #a3262a;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #171e28; --ink: #e8edf4; --muted: #a2adbd; --line: #2b3544;
    --accent: #6b9bff; --accent-ink: #0b1220; --accent-soft: #1b2a47;
    --free: #5fd39b; --free-soft: #12301f; --warn: #f2b45a; --warn-soft: #33260f; --bad: #ff8a8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #171e28; --ink: #e8edf4; --muted: #a2adbd; --line: #2b3544;
  --accent: #6b9bff; --accent-ink: #0b1220; --accent-soft: #1b2a47;
  --free: #5fd39b; --free-soft: #12301f; --warn: #f2b45a; --warn-soft: #33260f; --bad: #ff8a8a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
header { display: grid; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sign { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-display); font-size: 24px; line-height: 1; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; }
h2 { font-size: 17px; margin: 0; }
h3 { font-size: 15px; margin: 0; }
p { margin: 0; }
.tag { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 10px; }
.tag.real { color: var(--free); background: var(--free-soft); }
.muted { color: var(--muted); font-size: 13px; }
.back { color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); min-width: 0; }
.tile small { display: block; font-size: 12px; color: var(--muted); }
.tile b { font-size: 21px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tile.alert { border-color: var(--warn); background: var(--warn-soft); }
.bars { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.bars li { display: grid; grid-template-columns: minmax(84px, 34%) 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.bars .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .b { height: 10px; border-radius: 5px; background: var(--accent-soft); overflow: hidden; }
.bars .b i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.bars .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
.spark { width: 100%; height: auto; display: block; }
.spark rect { fill: var(--accent); } .spark rect.dim { opacity: .45; } .spark.alert rect { fill: var(--warn); }
.spark line { stroke: var(--line); }
.cap { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.cap b { color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.item .ttl { font-weight: 600; overflow-wrap: anywhere; }
.item .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
button, select, input, textarea { font: inherit; }
.btn { min-height: 44px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; touch-action: manipulation; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; }
.state { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.state.done { background: var(--free-soft); color: var(--free); } .state.rej { background: var(--warn-soft); color: var(--warn); }
label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
input, select, textarea { font-size: 16px; min-height: 48px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.msg { font-size: 13px; border-radius: 8px; padding: 8px 12px; background: var(--free-soft); color: var(--free); }
.note { font-size: 13px; border-radius: 8px; padding: 8px 12px; background: var(--warn-soft); color: var(--warn); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs div { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { min-height: 52px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 13px; font-weight: 600; display: grid; place-items: center; gap: 0; touch-action: manipulation; }
.tabs button > span { font-size: 18px; line-height: 1; }
.tabs button em { font-style: normal; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; margin-left: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
<div class="wrap">
  <header>
    <a class="back" href="./">← 데모로 돌아가기</a>
    <div class="brand"><span class="sign" aria-hidden="true">P</span><h1>파킹세이브 관리자</h1><span class="tag">데모</span></div>
    <p class="muted">서버 없이 보는 관리자 화면 미리보기입니다. <b>시설·요금·품질·중복·수집 이력은 실제 수집 데이터 집계</b>이고, 이용 통계·신고는 예시이며 처리 버튼은 이 화면에서만 동작합니다(저장 안 됨).</p>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="관리자 메뉴"><div role="tablist" id="tabs"></div></nav>
<script>
(() => {
  "use strict";
  const D = /*DATA*/;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const n = (x) => Number(x).toLocaleString("ko-KR");
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0) + "%";
  const kst = (iso) => iso ? new Date(Date.parse(iso) + 9 * 3600000).toISOString().slice(0, 16).replace("T", " ") : "없음";
  const FLAG = { SUNDAY_ASSUMED_HOLIDAY_RULE: "일요일에 공휴일 규칙 적용(추정)", SOURCE_KEY_COLLISION: "원천 관리번호 중복", COORD_MISSING: "좌표 없음", COORD_OUT_OF_RANGE: "좌표 범위 밖", FEE_MIXED: "혼합 요금(계산 불가)", FEE_INCOMPLETE: "요금 규칙 불완전", FEE_NO_ADDITIONAL: "추가요금 없음", FEE_VALUE_INVALID: "요금 값 오류", FEE_CONFLICT: "요금 규칙 충돌", FEE_KIND_UNSUPPORTED: "지원하지 않는 요금 유형", SCHEDULE_INVALID_TIME: "운영시간 형식 오류" };

  // 예시 운영 데이터(고정 난수 — 열 때마다 같은 모양)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const days = Array.from({ length: 30 }, (_, i) => { const d = new Date(Date.now() + 9 * 3600000 - (29 - i) * 86400000); const wk = [0, 6].includes(d.getUTCDay()); const base = 180 + i * 6; return { ymd: d.toISOString().slice(5, 10), search: Math.round(base * (wk ? 1.5 : 1) * (0.8 + rnd() * 0.4)), lot: 0, err: rnd() < 0.15 ? Math.ceil(rnd() * 4) : 0, lim: rnd() < 0.1 ? Math.ceil(rnd() * 12) : 0 }; });
  days.forEach((d) => { d.lot = Math.round(d.search * (0.55 + rnd() * 0.2)); });
  const CATS = { FEE: "요금이 다름", HOURS: "운영시간이 다름", CLOSED: "폐쇄·없어짐", LOCATION: "위치가 다름", OTHER: "기타" };
  const reports = D.lots.slice(0, 5).map((l, i) => ({ id: 101 + i, lot: l, cat: Object.keys(CATS)[i % 5], text: ["현장 안내판은 30분 1,000원이었습니다.", "일요일은 운영 안 한다고 적혀 있어요.", "공사 중이라 진입이 막혀 있습니다.", "입구가 반대편 골목에 있습니다.", "주차면수가 표시보다 적어 보입니다."][i], at: `${days[29 - i].ymd} ${9 + i}:2${i}`, status: "NEW" }));
  const dups = D.dup.sample.map((d) => ({ ...d, status: "PENDING" }));
  const overrides = [];
  let tab = "home", msg = "";

  const spark = (vals, label, alert) => { const W = 300, H = 56, max = Math.max(1, ...vals), bw = W / vals.length;
    return `<figure style="margin:0"><figcaption class="cap"><span>${label}</span><span>오늘 <b>${n(vals.at(-1))}</b> · 30일 ${n(vals.reduce((a, b) => a + b, 0))}</span></figcaption>
    <svg class="spark${alert ? " alert" : ""}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} 최근 30일, 최대 ${max}건, 오늘 ${vals.at(-1)}건">${vals.map((v, i) => `<rect class="${i === vals.length - 1 ? "" : "dim"}" x="${(i * bw + 1).toFixed(1)}" y="${(H - 2 - (v / max) * (H - 6)).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${((v / max) * (H - 6)).toFixed(1)}" rx="1.5"></rect>`).join("")}<line x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}"></line></svg></figure>`; };
  const bars = (rows, total) => `<ul class="bars">${rows.map(([k, v]) => `<li><span class="t">${esc(k)}</span><span class="b"><i style="width:${Math.max(2, (v / total) * 100).toFixed(1)}%"></i></span><span class="n">${n(v)}</span></li>`).join("")}</ul>`;
  const ageH = D.collected ? Math.round((Date.now() - Date.parse(D.collected)) / 3600000) : null;

  const views = {
    home: () => { const s7 = days.slice(-7).reduce((a, d) => a + d.search, 0), pend = reports.filter((r) => r.status === "NEW").length;
      return `<section class="panel"><div class="head"><h2>운영 현황</h2><span class="tag">예시 데이터</span></div>
        <div class="tiles"><div class="tile"><small>최근 7일 검색</small><b>${n(s7)}</b></div><div class="tile ${pend ? "alert" : ""}"><small>검토 대기 신고</small><b>${pend}건</b></div>
        <div class="tile"><small>적용 중 보정</small><b>${overrides.filter((o) => o.on).length}건</b></div><div class="tile ${ageH != null && ageH > 50 ? "alert" : ""}"><small>표준데이터 마지막 수집</small><b>${ageH == null ? "없음" : ageH >= 48 ? Math.round(ageH / 24) + "일 전" : ageH + "시간 전"}</b></div></div>
        ${spark(days.map((d) => d.search), "검색")}${spark(days.map((d) => d.lot), "주차장 상세 조회")}${spark(days.map((d) => d.err), "서버 오류", true)}${spark(days.map((d) => d.lim), "요청 제한(429)", true)}
        <p class="muted">실서비스에서는 날짜별 건수 합계만 저장하며 IP·위치·검색어는 기록하지 않습니다.</p></section>
      <section class="panel"><div class="head"><h2>데이터 현황</h2><span class="tag real">실제 집계</span></div>
        <div class="tiles"><div class="tile"><small>서비스 시설</small><b>${n(D.total)}</b></div><div class="tile"><small>무료 규칙 있음</small><b>${n(D.fee.free)}</b></div>
        <div class="tile"><small>유료 요금 계산 가능</small><b>${n(D.fee.base)}</b></div><div class="tile ${D.fee.none ? "alert" : ""}"><small>요금 정보 없음</small><b>${n(D.fee.none)}</b></div>
        <div class="tile"><small>운영시간 있음</small><b>${pct(D.sched, D.total)}</b></div><div class="tile ${D.noCoord ? "alert" : ""}"><small>좌표 없음(검색 제외)</small><b>${n(D.noCoord)}</b></div></div>
        <h3>시도별 시설 수</h3>${bars(D.sido, D.sido[0] ? D.sido[0][1] : 1)}
        ${D.flags.length ? `<h3>품질 표시(확인 필요 항목)</h3>${bars(D.flags.map(([k, v]) => [FLAG[k] || k, v]), D.flags[0][1])}` : ""}</section>`; },
    reports: () => `<section class="panel"><div class="head"><h2>정보 오류 신고</h2><span class="tag">예시 데이터</span></div>${msg ? `<p class="msg" role="status">${esc(msg)}</p>` : ""}
      <ul class="list">${reports.map((r) => `<li class="item"><div class="head"><span class="ttl">${esc(r.lot.name)}</span><span class="state ${r.status === "DONE" ? "done" : r.status === "REJECTED" ? "rej" : ""}">${{ NEW: "검토 대기", DONE: "반영 완료", REJECTED: "반려" }[r.status]}</span></div>
        <p class="sub">${esc(r.lot.a)}</p><p><b>${CATS[r.cat]}</b> — ${esc(r.text)}</p><p class="sub">접수 ${r.at} · #${r.id}</p>
        <div class="acts">${r.status === "NEW" ? `<button class="btn pri" data-rep="${r.id}" data-to="DONE">확인·반영</button><button class="btn" data-rep="${r.id}" data-to="REJECTED">반려</button><button class="btn" data-fix="${r.lot.id}">보정 입력</button>` : `<button class="btn" data-rep="${r.id}" data-to="NEW">대기로 되돌리기</button>`}</div></li>`).join("")}</ul></section>
      <section class="panel"><div class="head"><h2>중복 후보 검토</h2><span class="tag real">실제 집계</span></div><p class="muted">검토 대기 ${n(D.dup.pending)}건 · 동일 시설로 승인 ${n(D.dup.merged)}건. 점수 높은 순 ${dups.length}건 표시.</p>
      <ul class="list">${dups.map((d) => `<li class="item"><div class="head"><span class="sub">일치 점수 ${Number(d.score).toFixed(2)}</span><span class="state ${d.status === "MERGED" ? "done" : d.status === "REJECTED" ? "rej" : ""}">${{ PENDING: "검토 대기", MERGED: "동일 시설", REJECTED: "다른 시설" }[d.status]}</span></div>
        <p class="ttl">${esc(d.an)}</p><p class="sub">${esc(d.aa ?? "주소 없음")}</p><p class="ttl">${esc(d.bn)}</p><p class="sub">${esc(d.ba ?? "주소 없음")}</p>
        <div class="acts">${d.status === "PENDING" ? `<button class="btn pri" data-dup="${d.id}" data-to="MERGED">동일 시설</button><button class="btn" data-dup="${d.id}" data-to="REJECTED">다른 시설</button>` : `<button class="btn" data-dup="${d.id}" data-to="PENDING">되돌리기</button>`}</div></li>`).join("")}</ul></section>`,
    fix: () => `<section class="panel"><div class="head"><h2>요금·운영시간 보정</h2><span class="tag">데모 동작</span></div><p class="muted">현장 확인으로 원천 데이터와 다른 값을 바로잡습니다. 실서비스에서는 수집을 다시 해도 유지되고, 이용자 화면에 ‘관리자 보정 값’으로 표시됩니다.</p>${msg ? `<p class="msg" role="status">${esc(msg)}</p>` : ""}
      <form id="ovf" class="panel" style="padding:12px" novalidate><label>시설<select id="ov-lot">${D.lots.map((l) => `<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select></label>
        <div class="grid2"><label>기본시간(분)<input id="ov-bm" inputmode="numeric" value="30"></label><label>기본요금(원)<input id="ov-bf" inputmode="numeric" value="1000"></label>
        <label>추가 단위(분)<input id="ov-um" inputmode="numeric" value="10"></label><label>추가요금(원)<input id="ov-uf" inputmode="numeric" value="500"></label></div>
        <label>확인 근거(필수)<textarea id="ov-why" rows="2" placeholder="예: 11/16 현장 안내판 확인"></textarea></label><label>처리자 이름<input id="ov-by" autocomplete="off"></label>
        <p class="note" id="ov-err" role="alert" hidden></p><button class="btn pri" type="submit">보정 적용</button></form>
      <h3>보정 이력</h3>${overrides.length ? `<ul class="list">${overrides.map((o, i) => `<li class="item"><div class="head"><span class="ttl">${esc(o.name)}</span><span class="state ${o.on ? "done" : "rej"}">${o.on ? "적용 중" : "되돌림"}</span></div><p>${o.bm}분 ${n(o.bf)}원 + ${o.um}분당 ${n(o.uf)}원</p><p class="sub">${esc(o.why)} · ${esc(o.by)}</p>${o.on ? `<div class="acts"><button class="btn" data-rev="${i}">되돌리기</button></div>` : ""}</li>`).join("")}</ul>` : `<p class="muted">아직 보정이 없습니다.</p>`}</section>`,
    sync: () => `<section class="panel"><div class="head"><h2>수집 상태</h2><span class="tag real">실제 이력</span></div>
      <div class="tbl" tabindex="0" role="region" aria-label="최근 수집 이력 표(가로 스크롤)"><table><caption class="sr">최근 수집 이력</caption><thead><tr><th scope="col">시작(KST)</th><th scope="col">결과</th><th scope="col">받음</th><th scope="col">새로 저장</th></tr></thead>
      <tbody>${D.syncs.map((s) => `<tr><td>${kst(s.t)}</td><td>${{ SUCCESS: "성공", PARTIAL: "일부 성공", FAILED: "실패", RUNNING: "진행 중" }[s.st] || esc(s.st)}</td><td>${n(s.r ?? 0)}</td><td>${n(s.i ?? 0)}</td></tr>`).join("")}</tbody></table></div>
      <p class="muted">원천: 전국주차장정보표준데이터(공공데이터포털). 마지막 성공 ${kst(D.collected)} KST.</p>
      <div class="acts"><button class="btn" id="resync">표준데이터 다시 수집</button></div>${msg ? `<p class="note" role="status">${esc(msg)}</p>` : ""}</section>
      <section class="panel"><h2>실서비스 관리자 화면</h2><p class="muted">서버에 설치하면 <code>/admin</code>에서 관리자 토큰으로 접속합니다. 모든 처리 내역은 감사 기록에 남고, 수집은 일정에 따라 자동 실행됩니다.</p></section>`,
  };
  const TABS = [["home", "현황", "▦"], ["reports", "신고·중복", "✎"], ["fix", "보정", "⚙"], ["sync", "수집", "⟳"]];
  function render() {
    $("main").innerHTML = views[tab](); $("main").style.display = "grid"; $("main").style.gap = "14px";
    const pend = reports.filter((r) => r.status === "NEW").length;
    $("tabs").innerHTML = TABS.map(([k, t, ic]) => `<button type="button" role="tab" aria-selected="${tab === k}" data-tab="${k}"><span aria-hidden="true">${ic}</span><em>${t}${k === "reports" && pend ? `<span class="badge" aria-label="대기 ${pend}건">${pend}</span>` : ""}</em></button>`).join("");
    msg = "";
  }
  document.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
    if (d.tab) { tab = d.tab; render(); scrollTo(0, 0); return; }
    if (d.rep) { const r = reports.find((x) => x.id === Number(d.rep)); r.status = d.to; msg = `신고 #${r.id}: ${{ DONE: "반영 완료로 처리했습니다.", REJECTED: "반려했습니다.", NEW: "검토 대기로 되돌렸습니다." }[d.to]}`; render(); return; }
    if (d.dup) { const x = dups.find((y) => y.id === Number(d.dup)); x.status = d.to; render(); return; }
    if (d.fix) { tab = "fix"; render(); $("ov-lot").value = d.fix; scrollTo(0, 0); return; }
    if (d.rev) { overrides[Number(d.rev)].on = false; msg = "보정을 되돌렸습니다. 원천 데이터 값으로 표시됩니다."; render(); return; }
    if (b.id === "resync") { msg = "데모에서는 수집을 실행하지 않습니다. 실서비스에서는 이 버튼으로 즉시 수집을 시작합니다."; render(); }
  });
  document.addEventListener("submit", (e) => { if (e.target.id !== "ovf") return; e.preventDefault();
    const v = (id) => $(id).value.trim(), num = (id) => (/^\d{1,7}$/.test(v(id)) ? Number(v(id)) : NaN), er = $("ov-err");
    const bm = num("ov-bm"), bf = num("ov-bf"), um = num("ov-um"), uf = num("ov-uf");
    const bad = [bm, bf, um, uf].some(Number.isNaN) || bm < 1 || um < 1 ? "시간은 1분 이상, 요금은 0원 이상의 숫자로 입력하세요." : !v("ov-why") ? "확인 근거를 입력하세요." : !v("ov-by") ? "처리자 이름을 입력하세요." : "";
    if (bad) { er.textContent = bad; er.hidden = false; return; }
    const lot = D.lots.find((l) => String(l.id) === v("ov-lot"));
    overrides.unshift({ name: lot.name, bm, bf, um, uf, why: v("ov-why"), by: v("ov-by"), on: true }); msg = "보정을 적용했습니다(데모: 이 화면에서만 유지)."; render();
  });
  render();
})();
</script>
