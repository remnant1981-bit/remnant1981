name: 티스토리 자동 포스팅

# 휴대폰: GitHub 앱 → Actions → "티스토리 자동 포스팅" → Run workflow
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "AI가 쓸 주제 (비우면 topics.txt 사용)"
        required: false
        default: ""
      count:
        description: "topics.txt에서 작성할 개수 (0=사용 안 함)"
        required: false
        default: "1"
      visibility:
        description: "공개 범위"
        type: choice
        options: [private, public, protected]
        default: private
      extra:
        description: "추가 요청사항 (예: 초보자 대상)"
        required: false
        default: ""
  # 매일 자동 실행하려면 아래 주석 해제 (UTC 기준, 0:07 UTC = 09:07 KST)
  # schedule:
  #   - cron: "7 0 * * *"

permissions:
  contents: write

concurrency:
  group: tistory-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tistory-autopost
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
      TISTORY_COOKIES: ${{ secrets.TISTORY_COOKIES }}
      TISTORY_HEADLESS: "1"
      TOPIC: ${{ inputs.topic }}
      COUNT: ${{ inputs.count || '1' }}
      VISIBILITY: ${{ inputs.visibility || 'private' }}
      EXTRA: ${{ inputs.extra }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tistory-autopost/requirements.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 설정 확인
        run: |
          [ -n "$TISTORY_BLOG_NAME" ] || { echo "::error::Secrets 'TISTORY_BLOG_NAME' 미등록"; exit 1; }
          [ -n "$TISTORY_COOKIES" ]   || { echo "::error::Secrets 'TISTORY_COOKIES' 미등록"; exit 1; }

      - name: AI 글 작성
        run: |
          if [ -n "$TOPIC" ]; then
            [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Secrets 'ANTHROPIC_API_KEY' 미등록"; exit 1; }
            python ai_writer.py "$TOPIC" --visibility "$VISIBILITY" --extra "$EXTRA"
          elif [ "$COUNT" != "0" ] && grep -qv '^[[:space:]]*\(#.*\)\?$' topics.txt; then
            [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Secrets 'ANTHROPIC_API_KEY' 미등록"; exit 1; }
            python ai_writer.py --topics-file topics.txt --count "$COUNT" --visibility "$VISIBILITY" --extra "$EXTRA"
          else
            echo "작성할 주제 없음 → posts/ 대기 글만 발행"
          fi

      - name: 티스토리 발행
        run: python tistory_poster.py --all

      - name: 처리 결과 저장 (topics.txt, 발행된 대기 글 정리)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.txt posts
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "tistory-autopost: 발행 완료 항목 정리"
            git push
          fi

      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tistory-logs
          path: tistory-autopost/logs/
          retention-days: 3
