name: 티스토리 자동 포스팅

# 휴대폰 사용법
#  1) 설정 점검: Actions → 이 워크플로 → Run workflow → mode "로그인 점검"
#  2) 바로 발행: Run workflow → topic 입력 → Run
#  3) 주제 커밋: GitHub 앱에서 tistory-autopost/topics.txt 편집·커밋 → 자동 실행 (최대 3건)
#  4) 예약 발행: publish_at 에 'auto' 또는 '2026-11-05 09:00' → 매시간 자동 점검 후 시각이 된 글 발행
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [작성+발행, 로그인 점검]
        default: 작성+발행
      topic:
        description: "AI가 쓸 주제 (비우면 topics.txt 사용)"
        required: false
        default: ""
      count:
        description: "topics.txt에서 작성할 개수 (0=사용 안 함)"
        required: false
        default: "1"
      visibility:
        description: "공개 범위"
        type: choice
        options: [private, public, protected]
        default: private
      extra:
        description: "추가 요청사항 (예: 초보자 대상)"
        required: false
        default: ""
      publish_at:
        description: "예약 발행 (비우면 즉시 / auto = 빈 시간대 자동 / 2026-11-05 09:00)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tistory-autopost/topics.txt"
      - "tistory-autopost/posts/**"
  # 예약 발행 점검: 매시 7분 (발행할 글이 없으면 1분 안에 종료)
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: tistory-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tistory-autopost
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
      TISTORY_COOKIES: ${{ secrets.TISTORY_COOKIES }}
      # 매시 자동 실행(schedule)은 사람이 승인할 수 없으므로 카카오 로그인 시도 안 함 → 저장된 세션만 사용
      KAKAO_ID: ${{ github.event_name != 'schedule' && secrets.KAKAO_ID || '' }}
      KAKAO_PW: ${{ github.event_name != 'schedule' && secrets.KAKAO_PW || '' }}
      # 로그인 세션 암호화 키 (별도 등록 안 하면 카카오 비밀번호 사용)
      SESSION_KEY: ${{ secrets.SESSION_KEY || secrets.KAKAO_PW }}
      TISTORY_HEADLESS: "1"
      MODE: ${{ inputs.mode || '작성+발행' }}
      TOPIC: ${{ inputs.topic }}
      # push(주제 커밋) 실행 시 최대 3건
      COUNT: ${{ inputs.count || (github.event_name == 'push' && '3') || '1' }}
      # 기본 공개범위: 저장소 Settings → Variables 에 DEFAULT_VISIBILITY 등록 시 변경 (기본 private)
      VISIBILITY: ${{ inputs.visibility || vars.DEFAULT_VISIBILITY || 'private' }}
      EXTRA: ${{ inputs.extra }}
      # 예약: 실행 입력값 → 저장소 Variables DEFAULT_PUBLISH_AT (주제 커밋 실행용, 예: auto) 순
      PUBLISH_AT: ${{ inputs.publish_at || (github.event_name == 'push' && vars.DEFAULT_PUBLISH_AT) || '' }}
      # 자동 배정 시간대: 저장소 Variables SCHEDULE_SLOTS (예: 09:00,19:00), 기본 09:00
      SCHEDULE_SLOTS: ${{ vars.SCHEDULE_SLOTS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tistory-autopost/requirements.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 예약 점검 (매시 자동 실행일 때 발행할 글 없으면 종료)
        if: github.event_name == 'schedule'
        run: |
          if [ -n "$TISTORY_BLOG_NAME" ] && python tistory_poster.py --due; then
            echo "발행 시각이 된 글 있음 → 진행"
          else
            echo "발행할 글 없음 → 종료"; echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: 설정 확인
        if: env.SKIP != 'true'
        run: |
          echo "## 설정 상태" >> "$GITHUB_STEP_SUMMARY"
          for k in TISTORY_BLOG_NAME KAKAO_ID KAKAO_PW TISTORY_COOKIES ANTHROPIC_API_KEY; do
            if [ -n "${!k}" ]; then echo "- ✅ $k" >> "$GITHUB_STEP_SUMMARY"; else echo "- ⬜ $k (미등록)" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          [ -n "$TISTORY_BLOG_NAME" ] || { echo "::error::Secrets 'TISTORY_BLOG_NAME' 미등록"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] && [ -z "$TISTORY_COOKIES" ] && { [ -z "$KAKAO_ID" ] || [ -z "$KAKAO_PW" ]; }; then
            echo "::error::로그인 정보 없음 → Secrets 'KAKAO_ID'+'KAKAO_PW' 또는 'TISTORY_COOKIES' 등록 필요"; exit 1
          fi
          echo "TISTORY_SESSION_FILE=$RUNNER_TEMP/session.txt" >> "$GITHUB_ENV"

      - name: 저장된 로그인 세션 불러오기
        if: env.SKIP != 'true'
        uses: actions/cache/restore@v4
        with:
          path: tistory-autopost/.session.enc
          key: tistory-session-${{ github.run_id }}
          restore-keys: tistory-session-

      - name: 로그인 세션 복호화
        if: env.SKIP != 'true'
        run: |
          if [ -n "$SESSION_KEY" ] && [ -f .session.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in .session.enc -out "$TISTORY_SESSION_FILE" -pass env:SESSION_KEY 2>/dev/null; then
              echo "저장된 세션 사용"
            else
              echo "저장된 세션 해독 실패 → 새로 로그인"; rm -f "$TISTORY_SESSION_FILE"
            fi
          else
            echo "저장된 세션 없음 → 첫 로그인 (카카오톡 승인 필요)"
          fi
          echo "SESSION_HASH_BEFORE=$(sha256sum "$TISTORY_SESSION_FILE" 2>/dev/null | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: 로그인 점검 (카카오톡 승인 알림 오면 승인)
        if: env.MODE == '로그인 점검'
        run: python tistory_poster.py --check

      - name: AI 글 작성
        if: env.MODE != '로그인 점검' && github.event_name != 'schedule'
        run: |
          WHEN=()
          [ -n "$PUBLISH_AT" ] && WHEN=(--publish-at "$PUBLISH_AT")
          if [ -n "$TOPIC" ]; then
            [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Secrets 'ANTHROPIC_API_KEY' 미등록"; exit 1; }
            python ai_writer.py "$TOPIC" --visibility "$VISIBILITY" --extra "$EXTRA" "${WHEN[@]}"
          elif [ "$COUNT" != "0" ] && grep -qv '^[[:space:]]*\(#.*\)\?$' topics.txt; then
            [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Secrets 'ANTHROPIC_API_KEY' 미등록"; exit 1; }
            python ai_writer.py --topics-file topics.txt --count "$COUNT" --visibility "$VISIBILITY" --extra "$EXTRA" "${WHEN[@]}"
          else
            echo "작성할 주제 없음 → posts/ 대기 글만 발행"
          fi

      - name: 티스토리 발행 (카카오톡 로그인 승인 알림 오면 승인)
        if: env.MODE != '로그인 점검' && env.SKIP != 'true'
        run: |
          if python tistory_poster.py --due; then
            python tistory_poster.py --all
          else
            echo "지금 발행할 글 없음"; python tistory_poster.py --list | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: 처리 결과 저장 (topics.txt, 예약 글, 발행된 대기 글 정리)
        if: always() && env.MODE != '로그인 점검' && env.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.txt posts
          if [ -d posts/failed ]; then git add -f posts/failed; fi   # 실패 글 보관 (posts/ 로 옮기면 재시도)
          if [ -f history.jsonl ]; then git add history.jsonl; fi   # 훅 패턴·키워드 중복 방지용 이력
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "tistory-autopost: 발행 완료 항목 정리"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push
          fi

      - name: 로그인 세션 암호화
        id: enc
        if: always()
        run: |
          AFTER=$(sha256sum "$TISTORY_SESSION_FILE" 2>/dev/null | cut -d' ' -f1)
          if [ -n "$SESSION_KEY" ] && [ -s "$TISTORY_SESSION_FILE" ] && [ "$AFTER" != "$SESSION_HASH_BEFORE" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$TISTORY_SESSION_FILE" -out .session.enc -pass env:SESSION_KEY
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "로그인 세션 갱신 → 다음 실행부터 승인 생략 가능"
          fi
          rm -f "$TISTORY_SESSION_FILE"

      - name: 로그인 세션 저장
        if: always() && steps.enc.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: tistory-autopost/.session.enc
          key: tistory-session-${{ github.run_id }}

      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tistory-logs
          path: tistory-autopost/logs/
          retention-days: 3
