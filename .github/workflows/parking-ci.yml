name: ParkingSave CI

on:
  pull_request:
    paths: ['parking-save/**', '.github/workflows/parking-ci.yml']
  push:
    branches: [main]
    paths: ['parking-save/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parking-save
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parking-save/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_PATH: ':memory:'
