name: ParkingSave CI

on:
  pull_request:
    paths: ['parking-save/**', '.github/workflows/parking-ci.yml']
  push:
    branches: [main]
    paths: ['parking-save/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parking-save
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parking-save/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_PATH: ':memory:'
      # E2E: 목업 데이터로 운영 빌드를 띄워 주요 흐름(검색→상세→비교→영어 전환)·접근성(axe, 라이트·다크·영어) 회귀 점검
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: parking-save/playwright-report
          retention-days: 7
