name: Deploy 쿠폰 지갑 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'coupon-wallet/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # coupon-wallet/ 폴더만 게시 (저장소의 다른 파일은 게시되지 않음)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coupon-wallet
      - id: deployment
        uses: actions/deploy-pages@v4
