name: Deploy 쿠폰 지갑·메종도로시 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'coupon-wallet/**'
      - 'maison-dorothy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 게시 대상만 모음: 루트 = coupon-wallet/, /maison-dorothy/ = maison-dorothy/ (저장소의 다른 파일은 게시되지 않음)
      - name: 게시 폴더 구성
        run: |
          mkdir -p _site
          cp -r coupon-wallet/. _site/
          mkdir -p _site/maison-dorothy
          cp -r maison-dorothy/. _site/maison-dorothy/
          rm -f _site/maison-dorothy/order-apps-script.gs _site/maison-dorothy/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
