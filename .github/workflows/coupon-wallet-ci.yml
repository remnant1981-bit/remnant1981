name: Coupon Wallet CI

on:
  pull_request:
    paths: ['coupon-wallet/**', 'tests/coupon-wallet/**', 'push-server/**', 'tests/push-server/**', '.github/workflows/coupon-wallet-ci.yml']
  push:
    branches: [main]
    paths: ['coupon-wallet/**', 'tests/coupon-wallet/**', 'push-server/**', 'tests/push-server/**']

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/coupon-wallet/*.test.js" "tests/push-server/*.test.mjs"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/coupon-wallet/e2e.js
