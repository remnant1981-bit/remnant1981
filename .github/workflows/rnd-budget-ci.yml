name: R&D Budget CI

on:
  pull_request:
    paths: ['rnd-budget/**', 'tests/rnd-budget/**', '.github/workflows/rnd-budget-ci.yml']
  push:
    branches: [main]
    paths: ['rnd-budget/**', 'tests/rnd-budget/**']

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/rnd-budget/*.test.js"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/rnd-budget/e2e.js
        env:
          LANG: C.UTF-8  # 한글 다운로드 파일명 확인용
