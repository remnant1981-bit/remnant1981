<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f7b5f">
<title>쿠폰 지갑</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">홈</h1>
  <button class="icon-btn" data-action="open-settings" aria-label="설정">⋯</button>
</header>

<main id="view" aria-live="polite"></main>

<button class="fab" id="fab" data-action="add" aria-label="추가">＋</button>

<nav class="tabs" aria-label="메뉴">
  <button data-tab="home" class="on">홈</button>
  <button data-tab="coupons">쿠폰</button>
  <button data-tab="loyalty">적립</button>
</nav>

<!-- 쿠폰 입력 -->
<dialog id="dlg-coupon" aria-labelledby="coupon-form-title">
  <form id="form-coupon" novalidate>
    <h2 id="coupon-form-title">쿠폰 추가</h2>
    <input type="hidden" name="id">
    <label>브랜드 <input name="brand" list="brands" required maxlength="60" placeholder="예: 스타벅스" autocomplete="off"></label>
    <label>혜택 <input name="title" required maxlength="120" placeholder="예: 아메리카노 T 1잔 / 20% 할인"></label>
    <label>가치(원) <input name="value" type="number" inputmode="numeric" min="0" placeholder="절약 금액 계산용 (선택)"></label>
    <label>만료일 <input name="expires" type="date"></label>
    <label>쿠폰 번호 <input name="code" maxlength="120" placeholder="번호/코드 (선택)" autocomplete="off"></label>
    <label>바코드 이미지 <input name="image" type="file" accept="image/*"></label>
    <div id="img-preview" class="preview"></div>
    <label>메모 <textarea name="memo" rows="2" maxlength="500" placeholder="사용 조건, 사용처 등"></textarea></label>
    <p class="form-error" id="coupon-error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="ghost" data-action="close-dialog">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<!-- 적립 입력 -->
<dialog id="dlg-loyalty" aria-labelledby="loyalty-form-title">
  <form id="form-loyalty" novalidate>
    <h2 id="loyalty-form-title">적립 추가</h2>
    <input type="hidden" name="id">
    <label>브랜드 <input name="brand" list="brands" required maxlength="60" placeholder="예: 스타벅스" autocomplete="off"></label>
    <label>항목 <input name="name" required maxlength="120" placeholder="예: 겨울 프리퀀시 / 등급 유지 별"></label>
    <div class="grid2">
      <label>현재 <input name="current" type="number" inputmode="numeric" min="0" value="0" required></label>
      <label>목표 <input name="target" type="number" inputmode="numeric" min="1" required></label>
    </div>
    <label>마감일 <input name="deadline" type="date"></label>
    <label>보상 <input name="reward" maxlength="120" placeholder="예: 증정품 / 무료 음료 쿠폰"></label>
    <label>메모 <textarea name="memo" rows="2" maxlength="500"></textarea></label>
    <p class="form-error" id="loyalty-error" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="ghost danger" id="btn-del-loyalty" data-action="del-loyalty" hidden>삭제</button>
      <button type="button" class="ghost" data-action="close-dialog">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<!-- 쿠폰 상세 / 바코드 -->
<dialog id="dlg-detail" aria-label="쿠폰 상세"><div id="detail"></div></dialog>

<!-- 사용 완료(절약 금액 입력) -->
<dialog id="dlg-use" aria-labelledby="use-title">
  <form id="form-use" novalidate>
    <h2 id="use-title">사용 완료</h2>
    <input type="hidden" name="id">
    <label>실제 절약한 금액(원) <input name="saved" type="number" inputmode="numeric" min="0" placeholder="0"></label>
    <div class="row">
      <button type="button" class="ghost" data-action="close-dialog">취소</button>
      <button type="submit" class="primary">사용 완료</button>
    </div>
  </form>
</dialog>

<!-- 확인 -->
<dialog id="dlg-confirm" aria-labelledby="confirm-msg">
  <p id="confirm-msg" class="confirm-msg"></p>
  <div class="row">
    <button type="button" class="ghost" data-confirm="0">취소</button>
    <button type="button" class="primary" id="confirm-ok" data-confirm="1">확인</button>
  </div>
</dialog>

<!-- 설정 -->
<dialog id="dlg-settings" aria-labelledby="settings-title">
  <h2 id="settings-title">설정</h2>
  <div class="settings">
    <button type="button" class="block" data-action="enable-notify">🔔 알림 허용</button>
    <p class="hint" id="notify-state"></p>
    <p class="hint">알림은 앱을 열 때와 (지원되는 기기에서) 백그라운드 점검 시 만료 임박 항목을 알려 줌. 백그라운드 점검은 크롬이 주기를 정하므로 시각은 보장되지 않음.</p>
    <button type="button" class="block" data-action="export">⬇ 백업 내보내기 (JSON)</button>
    <label class="block file">⬆ 백업 불러오기 (병합)<input type="file" id="import-file" accept="application/json,.json"></label>
    <p class="hint" id="backup-state"></p>
    <button type="button" class="block" data-action="sample">샘플 데이터 넣기</button>
    <button type="button" class="block danger" data-action="wipe">전체 삭제</button>
    <p class="hint">데이터는 이 기기 브라우저에만 저장됨. 브라우저 데이터 삭제·기기 변경 시 사라지므로 주기적으로 백업 필요.</p>
    <p class="hint" id="storage-state"></p>
    <p class="hint" id="ver"></p>
  </div>
  <div class="row"><button type="button" class="primary" data-action="close-dialog">닫기</button></div>
</dialog>

<datalist id="brands"></datalist>
<div id="toast" class="toast" role="status" hidden></div>
<script src="logic.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
